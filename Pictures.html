<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Representation | Healthy Play Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2fff6;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #2e8b57;
            margin-top: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px;
        }

        .card {
            background: white;
            width: 250px;
            margin: 15px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 40px;
        }

        h3 {
            color: #2e8b57;
        }

        .bar {
            background-color: #ddd;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
        }

        .fill {
            height: 15px;
            background-color: #2e8b57;
        }

        .link {
            text-align: center;
            margin-bottom: 30px;
        }

        .link a {
            text-decoration: none;
            background-color: #2e8b57;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: bold;
        }

        .link a:hover {
            background-color: #256f46;
        }
    </style>
</head>

<body>

    <h1>Visual Representation of Healthy Play Builder</h1>

    <div class="container">

        <div class="card">
            <div class="icon">🏃</div>
            <h3>Physical Health</h3>
            <p>Improves strength and fitness</p>
            <div class="bar">
                <div class="fill" style="width: 80%;"></div>
            </div>
        </div>

        <div class="card">
            <div class="icon">🧠</div>
            <h3>Mental Wellness</h3>
            <p>Boosts focus and happiness</p>
            <div class="bar">
                <div class="fill" style="width: 70%;"></div>
            </div>
        </div>

        <div class="card">
            <div class="icon">👨‍👩‍👧</div>
            <h3>Social Skills</h3>
            <p>Encourages teamwork</p>
            <div class="bar">
                <div class="fill" style="width: 75%;"></div>
            </div>
        </div>

        <div class="card">
            <div class="icon">🎨</div>
            <h3>Creativity</h3>
            <p>Enhances imagination</p>
            <div class="bar">
                <div class="fill" style="width: 65%;"></div>
            </div>
        </div>

    </div>

    <!-- Attached Local Link -->
    <div class="link">
        <a href="index.html">Back to Index </a>
    </div>

</body>

</html>
